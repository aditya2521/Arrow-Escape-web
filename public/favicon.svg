<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient: Deep Royal Blue to Midnight Slate -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="45%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Gloss Sheen -->
    <linearGradient id="topGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- HERO GOLDEN ARROW GRADIENTS -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="20%" stop-color="#FEF08A"/>
      <stop offset="55%" stop-color="#FBBF24"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <linearGradient id="goldDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- CORAL ARROW GRADIENTS -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="40%" stop-color="#FB7185"/>
      <stop offset="80%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <linearGradient id="coralDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9F1239"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>

    <!-- CYAN ARROW GRADIENTS -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="80%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="cyanDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>

    <!-- SHINY SPECULAR HIGHLIGHT -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>

    <!-- STAR SPARKLE GRADIENT -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>

    <!-- 3D SHADOW FILTERS -->
    <filter id="shadowHeavy" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#080C16" flood-opacity="0.6"/>
    </filter>

    <filter id="shadowMedium" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#080C16" flood-opacity="0.45"/>
    </filter>

    <filter id="starGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FDE047" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- ================= SQUIRCLE BACKGROUND ================= -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="120" fill="url(#centerGlow)"/>

  <!-- Subtle Rim Light -->
  <rect x="5" y="5" width="502" height="502" rx="115" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.2"/>

  <!-- Speed Motion Trails Behind Hero Arrow -->
  <g stroke="#67E8F9" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M 68 400 C 110 400 160 380 190 320" stroke-width="14" stroke-dasharray="16 16"/>
    <path d="M 110 440 C 160 440 210 410 240 350" stroke-width="9" stroke-dasharray="12 14"/>
  </g>

  <!-- ================= TANGLED ARROW 1: CYAN (Bottom Left Loop) ================= -->
  <g filter="url(#shadowMedium)">
    <!-- 3D Extrusion Shadow -->
    <path d="M 120 370 L 230 370 C 265 370 290 345 290 310 L 290 260"
          stroke="url(#cyanDepth)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" fill="none"
          transform="translate(0, 10)"/>
    <polygon points="290,210 245,275 335,275" fill="url(#cyanDepth)" transform="translate(0, 10)"/>

    <!-- Main Cyan Body -->
    <path d="M 120 370 L 230 370 C 265 370 290 345 290 310 L 290 260"
          stroke="url(#cyanGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polygon points="290,210 245,275 335,275" fill="url(#cyanGrad)"/>

    <!-- Highlight -->
    <path d="M 130 360 L 230 360 C 255 360 278 338 278 310 L 278 270"
          stroke="#E0F2FE" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.65"/>
  </g>

  <!-- ================= TANGLED ARROW 2: CORAL PINK (Top Right Loop) ================= -->
  <g filter="url(#shadowMedium)">
    <!-- 3D Extrusion Shadow -->
    <path d="M 400 150 L 290 150 C 250 150 220 180 220 220 L 220 330"
          stroke="url(#coralDepth)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" fill="none"
          transform="translate(0, 12)"/>
    <polygon points="220,390 170,315 270,315" fill="url(#coralDepth)" transform="translate(0, 12)"/>

    <!-- Main Coral Body -->
    <path d="M 400 150 L 290 150 C 250 150 220 180 220 220 L 220 330"
          stroke="url(#coralGrad)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <polygon points="220,390 170,315 270,315" fill="url(#coralGrad)"/>

    <!-- Highlight -->
    <path d="M 390 140 L 290 140 C 242 140 208 174 208 220 L 208 300"
          stroke="#FFE4E6" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.75"/>
  </g>

  <!-- ================= HERO ESCAPING ARROW: GOLDEN AMBER ================= -->
  <!-- Bold, vibrant, tactile, breaking free from the puzzle! -->
  <g filter="url(#shadowHeavy)">
    <!-- 3D Deep Extrusion -->
    <path d="M 140 310 L 270 310 C 320 310 360 270 360 220 L 360 140"
          stroke="url(#goldDepth)" stroke-width="68" stroke-linecap="round" stroke-linejoin="round" fill="none"
          transform="translate(4, 16)"/>
    <polygon points="360,40 240,170 480,170" fill="url(#goldDepth)" transform="translate(4, 16)"/>

    <!-- Main Golden Spine -->
    <path d="M 140 310 L 270 310 C 320 310 360 270 360 220 L 360 140"
          stroke="url(#goldGrad)" stroke-width="68" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Bold Aerodynamic Arrowhead Bursting Straight Up -->
    <polygon points="360,42 245,168 475,168" fill="url(#goldGrad)"/>

    <!-- Juicy Gloss Highlight Curve -->
    <path d="M 152 296 L 270 296 C 322 296 346 264 346 218 L 346 140"
          stroke="url(#shineGrad)" stroke-width="16" stroke-linecap="round" fill="none"/>

    <!-- Head Highlight Flare -->
    <polygon points="360,65 295,150 360,150" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- ================= MAGICAL SPARKLES & STARS ================= -->
  <!-- Big Glowing Star at Arrow Tip -->
  <g filter="url(#starGlow)" transform="translate(435, 85)">
    <path d="M 0 -36 Q 0 0 36 0 Q 0 0 0 36 Q 0 0 -36 0 Q 0 0 0 -36 Z" fill="url(#starGrad)"/>
    <circle cx="0" cy="0" r="7" fill="#FFFFFF"/>
  </g>

  <!-- Medium Star on Left -->
  <g filter="url(#starGlow)" transform="translate(95, 120) scale(0.7)">
    <path d="M 0 -32 Q 0 0 32 0 Q 0 0 0 32 Q 0 0 -32 0 Q 0 0 0 -32 Z" fill="url(#starGrad)"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Small Cute Star on Bottom Right -->
  <g filter="url(#starGlow)" transform="translate(425, 410) scale(0.55)">
    <path d="M 0 -28 Q 0 0 28 0 Q 0 0 0 28 Q 0 0 -28 0 Q 0 0 0 -28 Z" fill="url(#starGrad)"/>
  </g>

  <!-- Playful Joy Dots -->
  <circle cx="360" cy="22" r="6" fill="#FEF08A" opacity="0.95"/>
  <circle cx="475" cy="180" r="5" fill="#FEF08A" opacity="0.85"/>
  <circle cx="75" cy="280" r="6" fill="#67E8F9" opacity="0.9"/>
  <circle cx="280" cy="460" r="6" fill="#FDE047" opacity="0.85"/>

  <!-- Top Glass Highlight Overlay -->
  <rect x="2" y="2" width="508" height="240" rx="118" fill="url(#topGloss)"/>
</svg>
